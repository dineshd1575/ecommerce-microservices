server {
    listen 80;
    server_name _;

    # User authentication service
    location /auth/ {
        rewrite ^/auth/(.*)$ /$1 break;

        proxy_pass http://user_auth:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Product management service
    location /products {
        proxy_pass http://product_management:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Order processing service
    location /orders {
        proxy_pass http://order_processing:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
